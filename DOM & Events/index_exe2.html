<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input id="input" type="text">
    <button onclick="checkReservation()">Check Reservation</button>
    <div id="result"></div>

    <script>
        const reservations = {
            Bob: { claimed: false },
            Ted: { claimed: true }
        };

        function checkReservation() {
            const name = document.getElementById("input").value.trim();
            if (reservations[name]) {
                if (!reservations[name]["claimed"]) {
                    document.getElementById("result").innerHTML = `Welcome, ${name}`;
                }
                else
                    document.getElementById("result").innerHTML = "Hmm, someone already claimed this reservation";
            }
            else
                document.getElementById("result").innerHTML = "You have no reservation";
        }
    </script>
</body>

</html>
